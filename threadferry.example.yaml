version: 5

owner_user: "user_owner"

agents:
  default:
    runtime: "codex"
    workspace: "/absolute/path/to/project"
  reviewer:
    runtime: "pi"
    workspace: "/absolute/path/to/another-project"
    model: "provider/model"

groups:
  "group_xxx":
    agent: "default"
    allow_users:
      - "user_owner"
    # 打开后群内所有成员都可以 @ 机器人使用，allow_users 在关闭后重新生效。
    # allow_all: true
